<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <title>Lai Siangtho</title>
  <!-- A lit candle in a disc. The disc is the drawing as given; the candle,
       which the drawing leaves open, is filled, so the mark reads on a dark
       surface as well as a light one. Where the viewer asks for a dark
       scheme (a browser tab, a dark desktop) the two colours change places.
       The candle lies under the disc and a little beyond its own outline, so
       no seam of the background shows between them; the clip keeps its foot
       on the rim. The PNGs are drawn from this file by scripts/icons.mjs. -->
  <style>
    .disc { fill: #1a1a1a; }
    .light { fill: #ffffff; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #ececec; }
      .light { fill: #1a1a1a; stroke: #1a1a1a; }
    }
  </style>
