# Releases, asked for by the commit that should be released.
#
#   node scripts/version.mjs --apply
#   git commit -am "release:all 26.09.29.9"      # or release:web, release:desktop
#   git push
#
#   release:web      tests → web build → laisiangtho.github.io
#   release:desktop  tests → draft release → macOS, Windows, Linux installers
#                    → the release is published once all three are attached.
#                    Its title is the tag (v26.09.29.11); its notes are the
#                    commits since the previous release
#                    (scripts/release-notes.mjs).
#   release:all      both
#
# Only the first line of the head commit of a push to master is read (with a
# squash merge, that is the pull request's title). The same choice is on the
# Actions tab as "Run workflow". The prefix is checked by
# scripts/release-plan.mjs, which also refuses a version stamped in one file
# but not the others; run it locally to see what a push would do.
#
# The desktop update check reads releases/latest and compares its tag, minus
# the "v", with the running version. The release stays a draft — invisible to
# that check — until every installer is on it, so nobody is told about an
# update whose download is not there yet. A tag that already exists is an
# error rather than an overwrite: restamp with scripts/version.mjs --apply.
#
# One-time setup (the deploy key for the web target) is in docs/releasing.md.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: What to release
        type: choice
        options: [all, web, desktop]
        default: all

# One release at a time. A second release push waits rather than cancelling a
# release that may already be half published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.plan.outputs.web }}
      # Off when this commit has already been released (see "Check the tag").
      desktop: ${{ steps.plan.outputs.desktop == 'true' && steps.tag.outputs.released != 'true' }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        name: Read the release plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TARGET: ${{ inputs.target }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::releases are made from master, not $REF"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node scripts/release-plan.mjs --target "$TARGET"
          else
            node scripts/release-plan.mjs
          fi
      # A tag that exists is either this release, already made — GitHub can
      # deliver one push twice, and the second run waits in the queue until the
      # first has published — or an earlier release whose version was never
      # restamped. The first is nothing left to do; the second is an error.
      - id: tag
        name: Check the tag
        if: steps.plan.outputs.desktop == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -z "$refs" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An annotated tag lists the tag object and, under ^{}, its commit.
          peeled=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ {print $1}')
          tagged=${peeled:-$(printf '%s\n' "$refs" | awk '{print $1; exit}')}
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "::notice::$TAG is already released from this commit ($GITHUB_SHA); the desktop release is skipped."
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$TAG is already released from ${tagged:0:7}, not this commit (${GITHUB_SHA:0:7}). Stamp a new version with 'node scripts/version.mjs --apply', commit and push again."
          exit 1

  test:
    needs: plan
    # Nothing left to release (a repeated run of a published desktop release)
    # needs no test run either.
    if: needs.plan.outputs.web == 'true' || needs.plan.outputs.desktop == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      gate: true

  # ---------------------------------------------------------------- web ----

  web:
    needs: [plan, test]
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment:
      name: web
      url: https://laisiangtho.github.io/
    steps:
      - name: Require the deploy key
        env:
          KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::secret PAGES_DEPLOY_KEY is not set on laisiangtho/lab; see docs/releasing.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: laisiangtho/laisiangtho.github.io
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: site
      # The site is the build and nothing else: everything from the previous
      # build is removed, apart from what belongs to the site repository itself.
      - name: Replace the site with this build
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name LICENSE ! -name CNAME -exec rm -rf {} +
          cp -R dist/web/. site/
          # Without this, Pages runs Jekyll over the build and drops any path
          # starting with an underscore.
          touch site/.nojekyll
      - name: Publish
        working-directory: site
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::the build is identical to what is already published; nothing to push"
            exit 0
          fi
          git commit -m "Lai Siangtho $VERSION" -m "Built from $SOURCE"
          git push

  # ------------------------------------------------------------ desktop ----

  draft:
    needs: [plan, test]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # The whole history and its tags: the notes list the commits since the
      # previous release tag, and scripts/release-notes.mjs refuses a shallow
      # clone rather than report no changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A draft left behind by a run that failed half way is reused, so running
      # the release again finishes it rather than making a second one.
      - name: Create the draft release
        run: |
          existing=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          case "$existing" in
            true) echo "::notice::reusing the draft release for $TAG"; exit 0 ;;
            false) echo "::error::$TAG is already published"; exit 1 ;;
          esac
          node scripts/release-notes.mjs --to "$GITHUB_SHA" > notes.md
          cat notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md

  installers:
    needs: [plan, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            files: release/*.dmg release/*.zip
          - os: windows-latest
            files: release/*-setup.exe release/*-portable.exe
          - os: ubuntu-latest
            files: release/*.AppImage release/*.deb release/*.rpm release/*.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      # rpmbuild is not on the Ubuntu image; the other Linux formats need
      # nothing beyond what electron-builder downloads itself.
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      # Published here, not by electron-builder: its publisher looks for a
      # release tagged v<semver> (v26.9.29), and the release is tagged with the
      # full stamped version (v26.09.29.9). File names come from
      # electron-builder.yml, the same as for a local package.
      - name: Package
        env:
          # Nothing is picked up from a keychain by accident; the ad-hoc
          # identity in electron-builder.yml is the only one used.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - name: Attach to the draft release
        env:
          PATTERNS: ${{ matrix.files }}
        run: |
          # Every pattern must match: a format that silently failed to build
          # would otherwise be a release with a download missing.
          shopt -s nullglob
          files=()
          missing=0
          for pattern in $PATTERNS; do
            # The pattern is meant to expand as a glob here.
            # shellcheck disable=SC2206
            matched=($pattern)
            if [ ${#matched[@]} -eq 0 ]; then
              echo "::error::nothing in release/ matches $pattern"
              missing=1
            fi
            files+=("${matched[@]}")
          done
          if [ $missing -ne 0 ]; then
            ls -la release || true
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  publish:
    needs: [plan, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # Publishing creates the tag at the released commit and makes this the
      # release the desktop update check reads.
      - run: gh release edit "$TAG" --draft=false --latest
